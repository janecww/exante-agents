# ============================================================================
# Process Evolution Examples
# Purpose:
#   Provides example mappings from laboratory-scale processes to potential
#   industrial-scale implementations.
#
# Scope:
#   - Supports the Process Evolution Agent.
#   - Examples are guidance only.
#   - Industrial process selection should consider technology-specific
#     requirements and available evidence.
# ============================================================================

process_evolution_examples:

  - id: PE001

    laboratory_process:
      - Reaction under heating

    industrial_process:
      - Heated liquid batch reactor with in-tank stirring

    engineering_function:
      - Chemical reaction

    rationale: >
      Preserves reaction conditions while enabling larger production volumes
      and improved process control.

    reference:
      - Piccinno et al. (2016)

  - id: PE002

    laboratory_process:
      - Mixing (magnetic stirrer)
      - Dispersing

    industrial_process:
      - In-tank stirring

    engineering_function:
      - Mixing

    rationale: >
      Provides equivalent mixing functionality at industrial scale.

    reference:
      - Piccinno et al. (2016)

  - id: PE003

    laboratory_process:
      - Blending
      - Mixing (viscous solution)
      - Homogenising
      - Dispersing

    industrial_process:
      - Rotor-stator homogenizer

    engineering_function:
      - High-shear mixing

    rationale: >
      Suitable for dispersing viscous fluids and producing homogeneous mixtures.

    reference:
      - Piccinno et al. (2016)

  - id: PE004

    laboratory_process:
      - Pestling
      - Grinding
      - Milling

    industrial_process:
      - Industrial grinding

    engineering_function:
      - Particle size reduction

    reference:
      - Piccinno et al. (2016)

  - id: PE005

    laboratory_process:
      - Membrane filtration
      - Reverse osmosis
      - Dialysis
      - Sieving
      - Laboratory centrifugation

    industrial_process:
      - Filtration
      - Centrifugation

    engineering_function:
      - Solid-liquid separation

    reference:
      - Piccinno et al. (2016)

  - id: PE006

    laboratory_process:
      - Rotary evaporation
      - Laboratory distillation

    industrial_process:
      - Distillation

    engineering_function:
      - Solvent separation

    reference:
      - Piccinno et al. (2016)

  - id: PE007

    laboratory_process:
      - Vacuum drying
      - Oven drying

    industrial_process:
      - Industrial drying

    engineering_function:
      - Drying

    reference:
      - Piccinno et al. (2016)

  - id: PE008

    laboratory_process:
      - Manual liquid transfer

    industrial_process:
      - Pumping system

    engineering_function:
      - Material transfer

    reference:
      - Piccinno et al. (2016)

  - id: PE009

    laboratory_process:
      - Waste disposal

    industrial_process:
      - Waste pretreatment
      - Solvent recycling
      - By-product recovery

    engineering_function:
      - Waste management

    reference:
      - Piccinno et al. (2016)

  - id: PE010

    laboratory_process:
      - Not explicitly present

    industrial_process:
      - Heat recovery through heat exchangers

    engineering_function:
      - Energy integration

    rationale: >
      Heat integration is commonly introduced during industrial process design
      to improve energy efficiency.

    reference:
      - Piccinno et al. (2016)

