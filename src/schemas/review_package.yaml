# ============================================================================
# Review Package Schema
# Purpose:
#   Shared working document for Stage 1 prospective LCA assumption development.
#
#   This document is iteratively refined by:
#     (1) Process Evolution Agent
#     (2) Scientific Review Agent
#
#   The Process Evolution Agent proposes industrial process assumptions,
#   inventory estimation methods, rationale and supporting evidence.
#
#   The Scientific Review Agent reviews these assumptions and provides
#   constructive feedback for refinement.
#
#   The final reviewed package is exported directly to Excel for
#   human review.
# ============================================================================

