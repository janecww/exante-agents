# ============================================================================
# Engineering Heuristics
# Purpose:
#   Provides general engineering heuristics to support the Process Evolution
#   Agent when developing prospective industrial process assumptions.
#
# Guiding Principle:
#   These heuristics supplement available evidence and should not override
#   higher-priority evidence sources defined in source_priority.yaml.
#
# Scope:
#   - Generic engineering guidance only
#   - Not technology-specific
#   - Intended for prospective LCA process evolution
# ============================================================================

general_principles:

  - id: GP001
    title: Preserve process objectives
    principle: >
      During scale-up, the primary engineering objective of each process
      step should remain unchanged, even if the industrial implementation
      differs significantly from the laboratory setup.

    examples:
      - Mixing remains mixing.
      - Separation remains separation.
      - Drying remains drying.
      - Chemical reaction remains chemical reaction.

  - id: GP002
    title: Prefer industrially established technologies
    principle: >
      When multiple industrial implementations are feasible, prefer
      technologies that are commercially established unless there is
      strong evidence supporting an alternative.

  - id: GP003
    title: Consider process integration
    principle: >
      Industrial processes often integrate multiple unit operations to
      improve overall process efficiency.

    objectives:
      - Reduce energy consumption
      - Reduce material losses
      - Reduce labour requirements
      - Reduce equipment footprint

  - id: GP004
    title: Prefer continuous operation when appropriate
    principle: >
      Continuous operation is generally preferred for high production
      volumes due to improved productivity and process consistency.

    suitable_when:
      - High production volume
      - Stable product quality
      - Continuous manufacturing

    exceptions:
      - Low production volume
      - Product customisation
      - Long residence time
      - Safety considerations


equipment_selection:

  - id: ES001
    title: Laboratory equipment rarely scales directly
    principle: >
      Laboratory equipment should not be directly assumed to exist at
      industrial scale. Instead, identify industrial equipment performing
      the same engineering function.

    examples:

      - laboratory: Magnetic stirrer
        industrial: Agitated reactor

      - laboratory: Laboratory centrifuge
        industrial: Disc-stack centrifuge or decanter centrifuge

      - laboratory: Dialysis tubing
        industrial: Ultrafiltration or diafiltration

      - laboratory: Freeze dryer
        industrial: Spray dryer or belt dryer

      - laboratory: Oven
        industrial: Continuous dryer

  - id: ES002
    title: Replace laboratory utilities
    principle: >
      Laboratory heating and cooling methods are typically replaced by
      industrial utility systems.

    examples:

      heating:

        - laboratory: Hot plate
          industrial: Steam heating

        - laboratory: Heating mantle
          industrial: Heat exchanger

      cooling:

        - laboratory: Ice bath
          industrial: Cooling water or refrigeration system


process_simplification:

  - id: PS001
    title: Simplify process where appropriate
    principle: >
      Industrial processes commonly reduce unnecessary processing steps
      while maintaining product quality.

    examples:
      - Combine repeated washing operations.
      - Reduce solvent exchange steps.
      - Integrate multiple unit operations.
      - Recycle process streams.


material_and_utility:

  - id: MU001
    title: Avoid linear scaling assumptions
    principle: >
      Material and utility consumption should not be assumed to scale
      linearly with production capacity.

    considerations:
      - Equipment efficiency
      - Heat integration
      - Material recovery
      - Process optimisation
      - Utility recycling

    recommendation: >
      Prefer engineering calculations or published evidence over simple
      scaling whenever possible.


technology_analogy:

  - id: TA001
    title: Use similar technologies cautiously
    principle: >
      When direct industrial evidence is unavailable, similar technologies
      may provide useful engineering guidance.

    similarity_criteria:
      - Feedstock characteristics
      - Reaction chemistry
      - Unit operations
      - Separation mechanisms
      - Product functionality
      - Industrial application

    recommendation: >
      Technology analogies should always be explicitly justified.


uncertainty:

  - id: U001
    title: Engineering judgement introduces uncertainty
    principle: >
      Engineering heuristics represent informed judgement rather than
      direct evidence.

    best_practices:
      - Document the engineering rationale.
      - State the heuristic applied.
      - Highlight associated uncertainty.
      - Submit assumptions for scientific review.

