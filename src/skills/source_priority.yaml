# ============================================================================
# Source Priority
# Purpose:
#   Defines the evidence hierarchy used by all agents when developing,
#   reviewing, or revising prospective LCA assumptions.
#
# Guiding Principle:
#   When multiple evidence sources are available, agents should always
#   prioritise the highest-ranked evidence. Lower-ranked evidence should
#   only be used when higher-ranked evidence is unavailable or insufficient.
# ============================================================================

evidence_hierarchy:

  - priority: 1
    source: user_provided_documents
    description: >
      User-supplied case documents, laboratory data, supplementary materials,
      and other project-specific information.

  - priority: 2
    source: built_in_engineering_knowledge
    description: >
      Engineering heuristics, estimation methods, process evolution examples,
      review specifications, and other reference materials provided within
      the framework.

  - priority: 3
    source: peer_reviewed_literature
    description: >
      Published journal articles and conference papers relevant to the
      technology or process.

  - priority: 4
    source: technical_reports_and_standards
    description: >
      Government reports, industry reports, technical manuals,
      standards, patents, and recognised engineering references.

  - priority: 5
    source: similar_technology_analogy
    description: >
      Evidence inferred from similar technologies or industrial processes
      when direct evidence is unavailable.

  - priority: 6
    source: general_web_resources
    description: >
      Credible online resources that are not peer-reviewed or formally
      published.

  - priority: 7
    source: llm_internal_knowledge
    description: >
      Model reasoning based on internal knowledge without external
      supporting evidence.


decision_rules:

  - >
    Always prefer higher-priority evidence over lower-priority evidence.

  - >
    If multiple sources of the same priority disagree, report the
    disagreement in the review package and explain the rationale for the
    selected assumption.

  - >
    If no external evidence is available, clearly state that the assumption
    is based on engineering judgement, technology analogy, or LLM reasoning.

  - >
    Every major process assumption and estimation method should be supported
    by at least one evidence source whenever reasonably possible.

  - >
    Assumptions without supporting evidence should be explicitly identified
    in the review comments for human evaluation.

