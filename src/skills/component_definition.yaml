version: 1.0

description: >
  Definitions of foreground inventory component categories used for
  inventory classification prior to estimation method retrieval.

scope: >
  These component categories are intentionally limited to the current
  proof-of-concept and may be extended in future versions.

components:

  reactant:
    definition: >
      A material intentionally consumed or chemically transformed during
      the process to produce the desired product.

  solvent:
    definition: >
      A material primarily used as the reaction, extraction, washing, or
      separation medium and not intended to become part of the final product.

  catalyst:
    definition: >
      A material that facilitates a chemical reaction without being
      intentionally consumed and may be recovered or reused.

  energy:
    definition: >
      Electricity consumed to run process equipment, such as mixers,
      stirrers, pumps, centrifuges, homogenisers, ultrasonic devices and
      other machinery (typically reported in kWh). "Energy" here means
      electrical energy only; thermal energy is the separate category
      "heat". If a measured electricity flow also covers heating (e.g. a
      heated stirrer or heating plate), it is still classified as energy,
      and the rationale states that it includes heating.

  heat:
    definition: >
      Thermal energy supplied to or removed from the process for heating
      or cooling, whatever its source: steam, hot water or hot oil, fuel
      firing, chilled water, refrigeration, or electric heating. Heat is
      the special case of energy kept as its own category because it is
      estimated differently: from the mass heated, its heat capacity, the
      temperature change and heat losses, rather than from equipment power
      and operating time.

classification_guidance:

  - Classify inventories according to their primary function within the process rather than their chemical identity.

  - Consider both the inventory name and the process context.

  - Assign exactly one component category to each inventory.

  - If multiple categories are plausible, select the most appropriate category and explain why human verification is recommended.

  - Do not infer the estimation method during classification; only determine the component category.

  - When suggesting an additional heat flow for a step whose measured electricity may already include heating, say so in the review reason, so the practitioner can avoid counting the same heating twice.