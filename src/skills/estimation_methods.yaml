# ============================================================================
# Estimation Methods
# Purpose:
#   Provides engineering-based methods for estimating foreground inventory
#   values after the industrial process has been selected.
#
# Scope:
#   - Supports the Process Evolution Agent.
#   - Methods are primarily adapted from Piccinno et al. (2016).
#   - Additional methods may be incorporated from future literature.
#   - Engineering equations (EM001–EM006): These are explicit calculation methods with equations and parameters
#   - General estimation approaches (EM007–EM011): These are strategies the agent can choose when an explicit engineering equation isn't available.
# ============================================================================

estimation_methods:

# ---------------------------------------------------------------------------
# EM001 - Total heating energy
# ---------------------------------------------------------------------------

  - id: EM001

    name: Total heating energy

    estimates:
      - Heat

    applicable_processes:
      - Heated reaction
      - Heated reactor

    estimation_type:
      Engineering calculation

    description: >
      Estimates the total heating energy required for a heated reaction,
      accounting for both useful heating and reactor heat losses.

    equation: |
      Q_react = (Q_heat + Q_loss) / η_heat

    required_parameters:
      - Heat required to raise reaction temperature
      - Reactor heat loss
      - Heating efficiency

    assumptions:
      - Heating efficiency accounts for heat recovery.

    reference:
      - Piccinno et al. (2016)

# ---------------------------------------------------------------------------
# EM002 - Heating to reaction temperature
# ---------------------------------------------------------------------------

  - id: EM002

    name: Heating to reaction temperature

    estimates:
      - Heat

    applicable_processes:
      - Heated reaction
      - Heated reactor

    estimation_type:
      Engineering calculation

    description: >
      Calculates the energy required to raise the reaction mixture from
      its initial temperature to the desired reaction temperature.

    equation: |
      Q_heat = Cp × m_mix × (T_r − T_0)

    required_parameters:
      - Specific heat capacity
      - Reaction mixture mass
      - Initial temperature
      - Reaction temperature

    assumptions:
      - Heat capacity is approximated using the primary solvent.
      - Minor reactants are neglected.

    reference:
      - Piccinno et al. (2016)

# ---------------------------------------------------------------------------
# EM003 - Stirring energy
# ---------------------------------------------------------------------------

  - id: EM003

    name: Stirring energy

    estimates:
      - Electricity

    applicable_processes:
      - Stirring
      - Mixing
      - Agitation

    estimation_type:
      Engineering calculation

    description: >
      Estimates electricity consumption during mechanical stirring.

    equation: |
      E_stir = (Np × ρ × N³ × d⁵ × t) / η_stir

    required_parameters:
      - Power number
      - Fluid density
      - Rotational speed
      - Impeller diameter
      - Operating time
      - Stirring efficiency

    parameter_sources:
      - Equipment specifications
      - Literature

    assumptions:
      - Assumes conventional impeller mixing.

    reference:
      - Piccinno et al. (2016)

# ---------------------------------------------------------------------------
# EM004 - Vaporisation energy
# ---------------------------------------------------------------------------

  - id: EM004

    name: Vaporisation energy

    estimates:
      - Heat

    applicable_processes:
      - Distillation
      - Rotary evaporation

    estimation_type:
      Engineering calculation

    description: >
      Estimates the heat required to vaporise the distillate.

    equation: |
      Q_vap = ΔH_vap × m_dist

    required_parameters:
      - Enthalpy of vaporisation
      - Distillate mass

    reference:
      - Piccinno et al. (2016)

# ---------------------------------------------------------------------------
# EM005 - Drying energy
# ---------------------------------------------------------------------------

  - id: EM005

    name: Drying energy

    estimates:
      - Heat

    applicable_processes:
      - Oven drying
      - Vacuum drying
      - Spray drying

    estimation_type:
      Engineering calculation

    description: >
      Estimates drying energy considering sensible heating,
      vaporisation and dryer efficiency.

    equation: |
      Q_dry =
      (Cp_liq × m_liq × (T_boil − T_0)
      + ΔH_vap × m_vap)
      / η_dry

    required_parameters:
      - Specific heat capacity
      - Liquid mass
      - Initial temperature
      - Boiling temperature
      - Heat of vaporisation
      - Mass evaporated
      - Dryer efficiency

    assumptions:
      - Dryer efficiency accounts for heat losses.

    reference:
      - Piccinno et al. (2016)

# ---------------------------------------------------------------------------
# EM006 - Rotor-stator homogenizer energy
# ---------------------------------------------------------------------------

  - id: EM006

    name: Rotor-stator homogenizer energy estimation

    estimates:
      - Electricity

    applicable_processes:
      - Rotor-stator homogenizer

    estimation_type:
      Engineering calculation

    description: >
      Estimates electricity consumption of a rotor-stator homogenizer.
      Uses the generic stirring energy equation with standardized
      equipment parameters recommended by Piccinno et al. (2016).

    based_on:
      - EM003

    equation:
      Same as EM003

    standardized_parameters:

      power_number:
        value: 2.39

      stirring_efficiency:
        value: 0.90

      impeller_diameter:

        100L: 0.072
        500L: 0.111
        1000L: 0.139
        5000L: 0.260
        10000L: 0.288

      rotational_speed:

        100L: 48.333
        500L: 48.333
        1000L: 48.333
        5000L: 20
        10000L: 20

    required_parameters:
      - Fluid density
      - Operating time

    assumptions:
      - Rotor-stator homogenizers behave similarly to high-shear stirring.
      - Standardized parameters are applicable unless equipment-specific
        values are available.

    reference:
      - Piccinno et al. (2016)

# ---------------------------------------------------------------------------
# EM007 - Stoichiometric calculation
# ---------------------------------------------------------------------------

  - id: EM007

    name: Stoichiometric calculation

    estimates:
      - Material inputs
      - Product outputs

    applicable_processes:
      - Chemical reaction

    estimation_type:
      Material balance

    description: >
      Estimates reactant and product quantities using reaction
      stoichiometry.

# ---------------------------------------------------------------------------
# EM008 - Mass balance
# ---------------------------------------------------------------------------

  - id: EM008

    name: Mass balance

    estimates:
      - Material flows
      - Waste streams

    estimation_type:
      Engineering calculation

    description: >
      Estimates unknown material flows using conservation of mass.

# ---------------------------------------------------------------------------
# EM009 - Literature-derived values
# ---------------------------------------------------------------------------

  - id: EM009

    name: Literature-derived values

    estimation_type:
      Literature

    description: >
      Estimates inventory values directly from published experimental,
      pilot-scale or industrial studies.

# ---------------------------------------------------------------------------
# EM010 - Similar technology analogy
# ---------------------------------------------------------------------------

  - id: EM010

    name: Similar technology analogy

    estimation_type:
      Engineering judgement

    description: >
      Estimates inventory values using analogous technologies when
      direct evidence is unavailable.

    assumptions:
      - Similarity should be explicitly justified.

# ---------------------------------------------------------------------------
# EM011 - Linear scaling
# ---------------------------------------------------------------------------

  - id: EM011

    name: Linear scaling

    estimation_type:
      Scaling

    description: >
      Scales laboratory inventory values proportionally to production
      capacity.

    limitations:
      - Does not account for economies of scale.
      - Should only be used when better engineering methods are unavailable.

